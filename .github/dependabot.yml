version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a few days before proposing a new release (supply-chain safety margin).
    cooldown:
      default-days: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*', 'astro-*']
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
