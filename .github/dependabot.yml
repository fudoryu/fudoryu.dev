version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a few days before proposing a new release (supply-chain safety margin).
    cooldown:
      default-days: 5
    ignore:
      # @astrojs/check only supports TypeScript 5–6; drop this once it accepts 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*', 'astro-*']
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
